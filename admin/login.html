<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | G-Tourism</title>
  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css"/>
  <link rel="stylesheet" href="../assets/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/animate.css">
  <link rel="stylesheet" href="../assets/css/magnific-popup.css">
  <link rel="stylesheet" href="../assets/css/meanmenu.css">
  <link rel="stylesheet" href="../assets/css/swiper-bundle.min.css">
  <link rel="stylesheet" href="../assets/css/datepickerboot.css">
  <link rel="stylesheet" href="../assets/css/nice-select.css">
  <link rel="stylesheet" href="../assets/css/color.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    body.login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('../assets/img/3.jpg') center/cover no-repeat fixed;
      position: relative;
    }
    body.login-page::after{
      content: "";
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.45);
    }
    .login-card{
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      padding: 32px 28px;
    }
    .login-logo{
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .login-logo img{ height: 64px; border-radius: 10px; object-fit: cover; }
    .login-title{ text-align: center; margin-bottom: 6px; }
    .login-sub{ text-align: center; color:#6c757d; margin-bottom: 22px; }
    .form-control{ height: 48px; }
    .theme-btn.btn-block{ width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .error-box{ display:none; margin-top: 12px; color:#b00020; font-weight: 600; }
    .footer-mini{ text-align:center; margin-top: 16px; color:#e9ecef; position: relative; z-index:1; }
    .showpass {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color:#6c757d; cursor:pointer;
    }
    .posr{ position: relative; }
  </style>
</head>
<body class="login-page">
  <div class="login-card wow fadeInUp" data-wow-delay=".2s">
    <div class="login-logo">
      <a href="../index.html" aria-label="Back to home">
        <img src="../assets/img/G Tourism.jpg" alt="G-Tourism Logo" loading="lazy">
      </a>
    </div>
    <h3 class="login-title">Admin Login</h3>
    <p class="login-sub">Sign in to manage content</p>

    <form id="adminLoginForm" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" placeholder="Enter username" required>
      </div>
      <div class="mb-3 posr">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter password" required>
        <span class="showpass" id="togglePass" title="Show/Hide password"><i class="fa-regular fa-eye"></i></span>
      </div>
      <button type="submit" class="theme-btn btn-block">Login <i class="fa-sharp fa-regular fa-arrow-right"></i></button>
      <div id="errorBox" class="error-box">Invalid username or password.</div>
    </form>

    <div class="mt-3 text-center">
      <a href="../index.html" class="text-decoration-none"><i class="fa-regular fa-arrow-left"></i> Back to site</a>
    </div>
  </div>

  <div class="footer-mini">© <span id="year"></span> G-Tourism. All rights reserved.</div>

  <!-- JS -->
  <script src="../assets/js/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/wow.min.js"></script>
  <script>
    // Init wow to keep motion consistent with site
    new WOW().init();

    // Simple front-end credentials (change as needed)
    const VALID_USER = 'admin';
    const VALID_PASS = 'admin123';

    // Show/Hide password
    const pass = document.getElementById('password');
    const toggle = document.getElementById('togglePass');
    toggle.addEventListener('click', () => {
      const isText = pass.getAttribute('type') === 'text';
      pass.setAttribute('type', isText ? 'password' : 'text');
      toggle.innerHTML = isText ? '<i class="fa-regular fa-eye"></i>' : '<i class="fa-regular fa-eye-slash"></i>';
    });

    // Handle login
    document.getElementById('adminLoginForm').addEventListener('submit', function(e){
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const err = document.getElementById('errorBox');

      if(u === VALID_USER && p === VALID_PASS){
        err.style.display = 'none';
        // Simulate session using localStorage
        localStorage.setItem('gt_admin_auth', 'true');
        // Redirect to dashboard
        window.location.href = './dashboard.html';
      } else {
        err.style.display = 'block';
      }
    });

    // Footer year
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
